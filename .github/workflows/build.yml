name: Build Mod DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Download Dependencies
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "lib"
        # ดึง MelonLoader Core
        Invoke-WebRequest -Uri "https://github.com/LavaGang/MelonLoader/releases/latest/download/MelonLoader.x64.zip" -OutFile "melon.zip"
        Expand-Archive -Path "melon.zip" -DestinationPath "lib/MelonLoader" -Force

    - name: Build Solution
      run: dotnet build --configuration Release /p:AssemblySearchPaths="${{ github.workspace }}/lib/;${{ github.workspace }}/lib/MelonLoader/net6/"

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LongYinTalentTweaks-DLL
        path: "**/bin/Release/**/LongYinTalentTweaks.dll"
