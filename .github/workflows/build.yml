name: Build Mod DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Setup MelonLoader & Game Dependencies
      run: |
        mkdir -p lib
        # ดาวน์โหลด MelonLoader เพื่อนำ DLL อ้างอิงมาใช้งาน
        curl -sL https://github.com/LavaGang/MelonLoader/releases/latest/download/MelonLoader.x64.zip -o melon.zip
        tar -xf melon.zip -C lib/
        
    - name: Build Solution
      run: dotnet build --configuration Release -p:AssemblySearchPaths="lib/MelonLoader/;lib/"

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LongYinTalentTweaks-DLL
        path: "**/bin/Release/**/LongYinTalentTweaks.dll"
